
name: Deploy GiftLink to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Arrange frontend files
        run: |
          mkdir -p src/pages
          cp main.jsx src/main.jsx
          cp style.css src/style.css
          cp RegisterPage.js src/pages/RegisterPage.js
          cp LoginPage.js src/pages/LoginPage.js

      - name: Configure base path
        run: |
          sed -i "s|defineConfig({|defineConfig({ base: '/fullstack-capstone-project/',|" vite.config.js

      - name: Build application
        run: |
          npm install
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
