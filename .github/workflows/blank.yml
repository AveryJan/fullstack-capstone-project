
name: Fullstack Capstone CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JSHint
        run: npm install --global jshint

      - name: Run Linter
        run: |
          jshint --version
          jshint --config .jshintrc sentiment/index.js

      - name: Complete workflow
        run: echo 'CI/CD workflow completed successfully'
